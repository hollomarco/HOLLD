<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLLD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            width: 100%;
        }
        .header-logo {
            width: 100%;
            display: block;
        }
        .header-logo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <header class="header-logo">
        <img src="holld_logo.png" alt="HOLLD Logo" onerror="this.onerror=null; this.src='https://placehold.co/1200x300/ffffff/000000?text=HOLLD';" />
    </header>
</body>
</html>
