<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLLD</title>
    <!-- Tailwind CSS -->
    <script src="HOLLD logo-1.png"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col items-center justify-center p-6 selection:bg-indigo-500 selection:text-white overflow-hidden relative">

    <!-- Subtle Background Glow -->
    <div class="absolute w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="absolute w-64 h-64 bg-violet-600/10 rounded-full blur-2xl pointer-events-none -z-10 translate-y-24"></div>

    <main class="w-full max-w-md mx-auto flex flex-col items-center justify-center text-center animate-fade-in">
        
        <!-- Logo Header -->
        <div class="mb-10">
            <h1 class="text-4xl sm:text-5xl font-black tracking-widest text-white uppercase">
                HOLLD<span class="text-indigo-500">.</span>
            </h1>
        </div>

        <!-- Immagine Prodotto / Tacca -->
        <div class="w-full aspect-square rounded-3xl bg-slate-900/80 border border-slate-800/80 shadow-2xl backdrop-blur-xl overflow-hidden flex items-center justify-center p-4 transition-transform duration-500 hover:scale-[1.02]">
            <!-- Sostituisci l'URL qui sotto con il percorso/link della tua immagine -->
            <img id="product-image" 
                 src="untitled.24.jpg" 
                 alt="HOLLD" 
                 class="w-full h-full object-cover rounded-2xl shadow-inner select-none"
                 onerror="this.onerror=null; this.src='https://placehold.co/600x600/1e293b/ffffff?text=HOLLD';" />
        </div>

        <!-- Minimal Toggle Button (opzionale per passare tra Solo Logo e Logo + Immagine) -->
        <div class="mt-8 flex gap-3 text-xs text-slate-500 font-medium">
            <button onclick="toggleDisplay('both')" id="btn-both" class="px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 transition hover:text-white">
                Prodotto & Logo
            </button>
            <button onclick="toggleDisplay('logo-only')" id="btn-logo" class="px-3 py-1.5 rounded-full bg-transparent hover:bg-slate-900 text-slate-500 transition hover:text-slate-300">
                Solo Logo
            </button>
        </div>

    </main>

    <script>
        function toggleDisplay(mode) {
            const imgContainer = document.querySelector('.aspect-square');
            const btnBoth = document.getElementById('btn-both');
            const btnLogo = document.getElementById('btn-logo');

            if (mode === 'logo-only') {
                imgContainer.classList.add('hidden');
                btnLogo.className = "px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 transition hover:text-white";
                btnBoth.className = "px-3 py-1.5 rounded-full bg-transparent hover:bg-slate-900 text-slate-500 transition hover:text-slate-300";
            } else {
                imgContainer.classList.remove('hidden');
                btnBoth.className = "px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 transition hover:text-white";
                btnLogo.className = "px-3 py-1.5 rounded-full bg-transparent hover:bg-slate-900 text-slate-500 transition hover:text-slate-300";
            }
        }
    </script>
